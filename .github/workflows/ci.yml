name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # sha do Hades-Skill contra o qual o job parity roda; trocar é mudança explícita, e o diff da matriz mostra o que mudou no TS
  HADES_SKILL_SHA: 0d5bfc2a5fdb6c8c950fc09fa1457d47d19b1000
  # tag do Hades-Core de onde sai o runner da matriz; a mesma do Cargo.toml
  HADES_CORE_TAG: v0.2.1

permissions:
  contents: read

jobs:
  parity:
    name: Paridade TS x Rust
    if: github.event_name != 'schedule'
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        name: Matriz do Thanatos
        run: |
          if [ -f parity/cases.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::parity/cases.toml ainda não existe: a matriz entra com o CLI completo"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.matrix.outputs.present == 'true'
        with:
          repository: The-Hades-Organization/Hades-Skill
          ref: ${{ env.HADES_SKILL_SHA }}
          path: hades-skill
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.matrix.outputs.present == 'true'
        with:
          bun-version: 1.4.4 # a do bun.lock da skill
      - name: Dependências da skill
        if: steps.matrix.outputs.present == 'true'
        working-directory: hades-skill
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        if: steps.matrix.outputs.present == 'true'
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        if: steps.matrix.outputs.present == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Runner da matriz (Hades-Core)
        if: steps.matrix.outputs.present == 'true'
        run: cargo install --locked --git https://github.com/The-Hades-Organization/Hades-Core --tag "$HADES_CORE_TAG" --root "$RUNNER_TEMP/hades-parity" hades-parity
      - name: Compilar o Thanatos
        if: steps.matrix.outputs.present == 'true'
        run: cargo build --locked -p thanatos-cli
      - name: Matriz de paridade
        if: steps.matrix.outputs.present == 'true'
        run: >
          "$RUNNER_TEMP/hades-parity/bin/hades-parity" run
          --cases parity/cases.toml
          --ts "$GITHUB_WORKSPACE/hades-skill"
          --rust target/debug/thanatos

  core:
    name: Core (sem gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude thanatos-app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude thanatos-app --locked

  app:
    name: App (gpui)
    if: github.event_name != 'schedule'
    timeout-minutes: 40
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo clippy -p thanatos-app --all-targets --locked -- -D warnings

  app-build:
    name: App build (gpui)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependências do Linux
        run: ./scripts/linux-deps.sh
      - run: cargo build -p thanatos-app --locked
