[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/The-Hades-Organization/Thanatos"

[workspace.dependencies]
hades-core = { git = "https://github.com/The-Hades-Organization/Hades-Core", tag = "v0.2.3" }
hades-ui = { git = "https://github.com/The-Hades-Organization/Hades-UI", tag = "v0.1.2" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regress = "0.10"
indexmap = "2"
rustix = { version = "1", features = ["process"] }
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", default-features = false, features = ["wayland", "x11"] }
gpui-component = "=0.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2
